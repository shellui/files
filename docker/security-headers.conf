add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# This app runs inside a Shellui shell on another origin, so X-Frame-Options
# is not set. Allowed parents come from FRAME_ANCESTORS at container start.
include /etc/nginx/snippets/frame-ancestors.conf;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
